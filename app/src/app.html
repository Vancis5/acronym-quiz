<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('philnits_theme');
					var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					if (saved === 'light' || (!saved && prefersLight)) {
						document.documentElement.classList.add('light');
					} else {
						document.documentElement.classList.remove('light');
					}
				} catch (e) {}
			})();
		</script>
		<script>
			document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
			document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
			document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
			document.addEventListener('touchmove', (e) => {
				if (e.touches.length > 1) e.preventDefault();
			}, { passive: false });
		</script>
		<script src="/three.r134.min.js"></script>
		<script src="/vanta.cells.min.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
